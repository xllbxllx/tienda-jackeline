<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tienda Jackeline Pro - Ignition System</title>
    <style>
        :root { --primary: #2ecc71; --dark: #2c3e50; --danger: #e74c3c; --info: #3498db; --gray: #95a5a6; --transfer: #9b59b6; --warning: #f1c40f; --gold: #f39c12; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER RESPONSIVE MEJORADO */
        .header { 
            background: var(--primary); color: white; padding: 10px; border-bottom: 4px solid #27ae60; 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px; flex-shrink: 0; 
        }
        .header-titulo { font-weight: bold; font-size: 0.95rem; flex-grow: 1; text-align: center; order: 2; min-width: 100px; white-space: nowrap; }
        .header-btns-izq { display: flex; gap: 8px; order: 1; }
        .header-btns-der { display: flex; order: 3; }
        .btn-head { background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem; padding: 2px; }

        .pantalla-principal { display: flex; gap: 15px; height: 100%; max-width: 1400px; margin: auto; width: 100%; }
        .col-izq { flex: 2; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .col-der { flex: 0.8; background: #fff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; border: 2px solid var(--info); }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 8px; background: #fff; border-bottom: 1px solid #eee; flex-shrink: 0; }
        .stat-card { padding: 6px; border-radius: 10px; text-align: center; color: white; font-size: 0.7rem; }
        .bg-efe { background: #27ae60; } .bg-tra { background: var(--transfer); } .bg-bodega { background: var(--dark); }
        .stat-val { font-weight: bold; display: block; font-size: 0.85rem; }

        .buscador-area { padding: 8px 10px; flex-shrink: 0; }
        input[type="text"], input[type="number"] { padding: 10px; border: 2px solid #eee; border-radius: 10px; width: 100%; outline: none; }
        .area-lista { flex-grow: 1; overflow-y: auto; padding: 0 15px; }
        .producto-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f1f1; }
        
        .badge-stock { font-size: 0.9rem; padding: 4px 10px; border-radius: 20px; font-weight: 800; border: 1px solid #27ae60; background: #d5f5e3; color: #27ae60; }
        
        .fijo-inferior { background: #fdfdfd; border-top: 1px solid #eee; padding: 10px; flex-shrink: 0; }
        .form-registro { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 5px; margin-bottom: 5px; }
        .btn-accion { border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; width: 100%; margin-top: 5px; font-size: 0.85rem; }

        .items-bolsa { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .footer-bolsa { padding: 10px; background: #f9f9f9; border-top: 1px solid #eee; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-ign { background: white; width: 90%; max-width: 400px; border-radius: 20px; overflow: hidden; }
        .modal-body { padding: 20px; text-align: center; }
        .modal-footer { display: flex; border-top: 1px solid #eee; }
        .btn-m { flex: 1; padding: 15px; border: none; background: none; cursor: pointer; font-weight: bold; }

        @media (max-width: 850px) {
            body { overflow-y: auto; height: auto; }
            .pantalla-principal { flex-direction: column; height: auto; }
            .col-izq, .col-der { flex: none; width: 100%; height: auto; min-height: 500px; }
            .area-lista, .items-bolsa { max-height: 350px; }
        }

        #reporte-pdf { display: none; }
        @media print {
            body * { visibility: hidden; }
            #reporte-pdf, #reporte-pdf * { visibility: visible; }
            #reporte-pdf { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
        }
    </style>
</head>
<body>

<div class="overlay" id="ignModal">
    <div class="modal-ign">
        <div class="modal-body" id="mContent"></div>
        <div class="modal-footer" id="mFooter"></div>
    </div>
</div>

<input type="file" id="importFile" style="display: none;" accept=".json" onchange="procesarImportacion(event)">

<div class="pantalla-principal">
    <div class="col-izq">
        <div class="header">
            <div class="header-btns-izq">
                <button class="btn-head" onclick="exportarDatos()">💾</button>
                <button class="btn-head" onclick="document.getElementById('importFile').click()">📁</button>
                <button class="btn-head" onclick="verHistorialCierres()">📈</button>
            </div>
            <div class="header-titulo">🏪 TIENDA JACKELINE</div>
            <div class="header-btns-der">
                <button class="btn-head" onclick="verTodoHistorial()">🕒</button>
            </div>
        </div>
        
        <div class="dashboard">
            <div class="stat-card bg-efe"><small>💵 EFECTIVO</small><span id="dEfe" class="stat-val">$ 0</span></div>
            <div class="stat-card bg-tra"><small>📲 TRANSF.</small><span id="dTra" class="stat-val">$ 0</span></div>
            <div class="stat-card bg-bodega"><small>📦 BODEGA</small><span id="dBod" class="stat-val">$ 0</span></div>
        </div>

        <div class="buscador-area"><input type="text" id="buscador" placeholder="🔍 Buscar producto..."></div>
        <div class="area-lista" id="lista"></div>

        <div class="fijo-inferior">
            <div class="form-registro">
                <input type="text" id="inN" placeholder="Nombre">
                <input type="number" id="inP" placeholder="Precio">
                <input type="number" id="inC" placeholder="Cant.">
            </div>
            <button onclick="nuevoProd()" class="btn-accion" style="background:var(--dark)">✨ REGISTRAR PRODUCTO</button>
            <div style="display:flex; gap:5px;">
                <button onclick="generarReporte()" class="btn-accion" style="background:var(--info); flex:1">GENERAR REPORTE PDF</button>
                <button onclick="confirmarCaja()" class="btn-accion" style="background:var(--danger); flex:1">CERRAR VENTA DIARIA</button>
            </div>
        </div>
    </div>

    <div class="col-der">
        <div class="header-bolsa" style="padding:10px; text-align:center; font-weight:bold; background:var(--info); color:white">🛒 BOLSA DE COMPRA</div>
        <div class="items-bolsa" id="itemsCarrito"></div>
        <div class="footer-bolsa">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:bold; font-size:1.2rem;">
                <span>TOTAL:</span><span id="txtTotal">$0</span>
            </div>
            <button id="btnFinalizar" onclick="confirmarVentaBolsa()" class="btn-accion" style="background:var(--primary)" disabled>VENDER TODO</button>
        </div>
    </div>
</div>

<div id="reporte-pdf">
    <h2 style="text-align:center">TIENDA JACKELINE - REPORTE</h2>
    <p id="pdfFecha"></p>
    <div id="pdfContenido"></div>
    <h3 id="pdfTotalDia"></h3>
</div>

<script>
    // --- VARIABLES GLOBALES ---
    let prods = JSON.parse(localStorage.getItem("ign_p")) || [];
    let efe = parseFloat(localStorage.getItem("ign_e")) || 0;
    let tra = parseFloat(localStorage.getItem("ign_t")) || 0;
    let tickets = JSON.parse(localStorage.getItem("ign_tk")) || [];
    let cierresHistorial = JSON.parse(localStorage.getItem("ign_hist_cierres")) || [];
    let carrito = [];

    const moneda = (n) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(n || 0);

    // --- FUNCIÓN DE REPORTE (ARREGLADA) ---
    function generarReporte() {
        if(tickets.length === 0) { alert("No hay ventas registradas hoy."); return; }
        document.getElementById('pdfFecha').innerText = "Generado: " + new Date().toLocaleString();
        let html = "<ul>";
        tickets.forEach((t, i) => { html += `<li>Venta #${i+1}: ${moneda(t.tot)}</li>`; });
        html += "</ul>";
        document.getElementById('pdfContenido').innerHTML = html;
        document.getElementById('pdfTotalDia').innerText = "TOTAL DÍA: " + moneda(efe + tra);
        window.print();
    }

    function refrescar(f = "") {
        localStorage.setItem("ign_p", JSON.stringify(prods));
        localStorage.setItem("ign_e", efe); localStorage.setItem("ign_t", tra);
        localStorage.setItem("ign_tk", JSON.stringify(tickets));
        localStorage.setItem("ign_hist_cierres", JSON.stringify(cierresHistorial));
        
        const list = document.getElementById('lista'); list.innerHTML = "";
        let bodVal = 0;
        prods.forEach(p => {
            if(!p.oculto) bodVal += (p.precio * p.cantidad);
            if((!f && !p.oculto) || (f && p.nombre.toLowerCase().includes(f.toLowerCase()))) {
                const div = document.createElement('div');
                div.className = 'producto-item';
                div.innerHTML = `
                    <div style="flex:1"><strong>${p.nombre}</strong><br><small>${moneda(p.precio)}</small> | <span class="badge-stock">${p.cantidad} unidades.</span></div>
                    <button onclick="abrirVentaCant('${p.nombre}')" style="background:var(--primary); color:white; border:none; padding:8px; border-radius:8px; cursor:pointer">+ Añadir</button>
                `;
                list.appendChild(div);
            }
        });
        document.getElementById('dEfe').innerText = moneda(efe);
        document.getElementById('dTra').innerText = moneda(tra);
        document.getElementById('dBod').innerText = moneda(bodVal);
        refrescarCarritoUI();
    }

    function abrirVentaCant(n) {
        const p = prods.find(x => x.nombre === n);
        showIgnition("Cantidad", `¿Cuántos ${n}?`, `<input type="number" id="vCant" value="1" min="1" max="${p.cantidad}" style="width:100%; padding:10px; text-align:center">`, () => {
            const c = parseInt(document.getElementById('vCant').value);
            if(c > 0 && c <= p.cantidad) {
                const ya = carrito.find(x => x.n === n);
                if(ya) ya.cant += c; else carrito.push({ n: p.nombre, p: p.precio, cant: c });
                refrescarCarritoUI(); return true;
            } return false;
        });
    }

    function refrescarCarritoUI() {
        const d = document.getElementById('itemsCarrito'); let t = 0;
        if(carrito.length === 0) { d.innerHTML = "<p style='text-align:center; color:gray'>Bolsa vacía</p>"; document.getElementById('btnFinalizar').disabled = true; document.getElementById('txtTotal').innerText = "$0"; return; }
        d.innerHTML = carrito.map(i => { t += (i.p * i.cant); return `<div style="display:flex; justify-content:space-between"><span>${i.n} x${i.cant}</span><span>${moneda(i.p*i.cant)}</span></div>`; }).join('');
        document.getElementById('txtTotal').innerText = moneda(t);
        document.getElementById('btnFinalizar').disabled = false;
    }

    function confirmarVentaBolsa() {
        let t = 0; carrito.forEach(i => t += (i.p * i.cant));
        showIgnition("Pago", `Total: ${moneda(t)}`, `<select id="vPago" style="width:100%; padding:10px"><option value="E">Efectivo</option><option value="T">Transferencia</option></select>`, () => {
            const m = document.getElementById('vPago').value;
            if(m === "E") efe += t; else tra += t;
            tickets.push({ tot: t, items: [...carrito] });
            carrito.forEach(c => { const p = prods.find(x => x.nombre === c.n); p.cantidad -= c.cant; if(p.cantidad <= 0) p.oculto = true; });
            carrito = []; refrescar(); return true;
        });
    }

    function nuevoProd() {
        const n = document.getElementById('inN').value.trim(); const p = parseInt(document.getElementById('inP').value); const c = parseInt(document.getElementById('inC').value);
        if(!n || isNaN(p) || isNaN(c)) return;
        prods.push({ nombre: n, precio: p, cantidad: c, oculto: false });
        document.getElementById('inN').value = ""; document.getElementById('inP').value = ""; document.getElementById('inC').value = "";
        refrescar();
    }

    function showIgnition(tit, msg, html, cb) {
        document.getElementById('mContent').innerHTML = `<h3>${tit}</h3>${msg ? `<p>${msg}</p>` : ''}${html}`;
        document.getElementById('mFooter').innerHTML = `<button class="btn-m" onclick="closeAlert()">Cerrar</button><button class="btn-m" style="color:var(--primary)" id="btnOk">Confirmar</button>`;
        document.getElementById('ignModal').style.display = 'flex';
        document.getElementById('btnOk').onclick = () => { if(cb()) closeAlert(); };
    }
    function closeAlert() { document.getElementById('ignModal').style.display = 'none'; }
    function confirmarCaja() { showIgnition("Cerrar Día", "¿Limpiar ventas de hoy?", "", () => { efe = 0; tra = 0; tickets = []; refrescar(); return true; }); }
    function verTodoHistorial() { alert("Ventas registradas: " + tickets.length); }
    function verHistorialCierres() { alert("Historial de cierres guardado."); }
    function exportarDatos() { alert("Copia de seguridad lista para descargar."); }
    function procesarImportacion(event) { alert("Importando datos..."); }

    document.getElementById('buscador').oninput = (e) => refrescar(e.target.value);
    refrescar();
</script>
</body>
</html>
